[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-gpu-python-model"
version = "0.1.0"
description = "Cycle-accurate, module-aligned Python model of tiny-gpu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tiny-gpu contributors" }]
dependencies = []

[project.scripts]
tiny-gpu-trace = "tiny_gpu.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_gpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
